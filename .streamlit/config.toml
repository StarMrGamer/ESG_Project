# ESG Momentum Radar — token palette from the design mockup (IBM Plex, dark-navy
# canvas, mint-green accent). app.py injects the full light/dark variable system at
# runtime; these base values just keep the first paint on-brand (no light flash).
[theme]
base = "dark"
primaryColor = "#35d39a"              # mint green — primary actions / accent
backgroundColor = "#0a0e16"           # near-black navy canvas
secondaryBackgroundColor = "#0c1220"  # sidebar / secondary surfaces
textColor = "#e7ebf3"                 # off-white
font = "sans serif"
